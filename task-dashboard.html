<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Task Dashboard</title>
<style>
  :root {
    --maroon: #800000;
    --light-grey: #D9D9D9;
    --dark-grey: #737373;
    --footer-grey: #333333;
    --white: #FFFFFF;
    --lake: #007396;
    --lake-dark: #002A3A;
    --goldenrod: #CC8A00;
    --forest: #275D38;
    --brick: #A4343A;
    --bg: #FAFAFA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--footer-grey);
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  header {
    background: var(--white);
    border-bottom: 3px solid var(--maroon);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; padding: 16px 0;
  }
  .header-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .header-left img { height: 36px; width: auto; flex-shrink: 0; }
  .divider { width: 1px; height: 36px; background: var(--light-grey); }
  h1 { font-size: 18px; font-weight: 600; margin: 0; line-height: 1.2; }
  .subtitle { font-size: 13px; color: var(--dark-grey); margin: 2px 0 0; }
  button { font-family: inherit; cursor: pointer; }
  .btn-primary {
    background: var(--maroon); color: var(--white); border: none;
    padding: 9px 16px; border-radius: 4px; font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-secondary {
    background: var(--white); color: var(--footer-grey); border: 1px solid var(--light-grey);
    padding: 9px 16px; border-radius: 4px; font-size: 13px; font-weight: 500;
  }
  .banner {
    background: #EAF4F7; color: var(--lake-dark); font-size: 13px;
    padding: 10px 0; border-bottom: 1px solid #cfe4ea;
  }
  .banner.editor { background: #FBF0D6; color: #5c3d00; border-bottom-color: #f0dca0; }
  main { padding: 24px 0 40px; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
  @media (min-width: 700px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
  .card {
    background: var(--white); border: 1px solid var(--light-grey); border-radius: 8px; padding: 16px;
  }
  .stat-label { font-size: 12px; color: var(--dark-grey); margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 600; }
  .section-title { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  .group-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px) { .group-grid { grid-template-columns: repeat(5, 1fr); } }
  .group-chip {
    text-align: left; border-radius: 6px; padding: 10px 12px; background: #F5F5F5;
    border: 1px solid var(--light-grey); font-family: inherit;
  }
  .group-chip.active-chip { border-width: 1px; }
  .group-chip .dot-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .group-chip .g-label { font-size: 11px; color: var(--dark-grey); line-height: 1.2; }
  .group-chip .g-count { font-size: 18px; font-weight: 600; }
  .filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    background: var(--white); border: 1px solid var(--light-grey); border-radius: 8px; padding: 14px; margin: 20px 0;
  }
  .search-box { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
  .search-box input { border: none; outline: none; font-size: 14px; width: 100%; background: transparent; }
  select {
    font-size: 13px; padding: 7px 8px; border-radius: 4px; border: 1px solid var(--light-grey);
    background: var(--white); color: var(--footer-grey); font-family: inherit;
  }
  .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
  .clear-link { font-size: 13px; color: var(--dark-grey); text-decoration: underline; background: none; border: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 14px; background: #F5F5F5; color: var(--dark-grey);
    font-weight: 500; white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th.active { color: var(--maroon); }
  tbody td { padding: 12px 14px; border-top: 1px solid var(--light-grey); vertical-align: top; }
  tbody tr:hover { background: #FAFAFA; }
  .task-title { font-weight: 500; }
  .task-desc { font-size: 12px; color: var(--dark-grey); margin-top: 2px; max-width: 420px; }
  .task-meta { font-size: 11px; color: var(--dark-grey); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .table-card { background: var(--white); border: 1px solid var(--light-grey); border-radius: 8px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  .empty-state { text-align: center; padding: 48px 20px; }
  .empty-state p { margin: 0 0 6px; }
  .empty-title { font-weight: 500; }
  .empty-sub { font-size: 13px; color: var(--dark-grey); }
  .icon-btn { background: none; border: none; padding: 6px; border-radius: 4px; }
  .icon-btn:hover { background: #F0F0F0; }
  .footer-note { text-align: right; font-size: 12px; color: var(--dark-grey); margin-top: 10px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(51,51,51,0.55); display: flex; align-items: flex-start;
    justify-content: center; padding: 24px; overflow-y: auto; z-index: 100;
  }
  .modal {
    background: var(--white); border-radius: 8px; width: 100%; max-width: 560px; margin-top: 24px;
  }
  .modal-header { display: flex; align-items: center; justify-content: between; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--light-grey); }
  .modal-header h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--light-grey); }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--dark-grey); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; font-size: 13px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--light-grey);
    font-family: inherit; outline: none;
  }
  .field textarea { resize: none; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .req { color: var(--brick); }
  .error-text { color: var(--brick); font-size: 12px; margin: 0; }
  svg { display: block; }
  @media (max-width: 560px) { .row-2, .row-3 { grid-template-columns: 1fr; } }
</style>
</head>

        <h1>Project Task Dashboard</h1>
        <p class="subtitle">Dorchester Residential Commons Tracking Log</p>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button class="btn-primary" id="addTaskBtn" style="display:none;">
        <span id="plusIcon"></span> Add Task
      </button>
      <button class="btn-secondary" id="exportBtn" style="display:none;">Export Backup</button>
      <button class="btn-secondary" id="importBtn" style="display:none;">Import Backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;" />
      <button class="btn-secondary" id="editorToggleBtn">Editor Mode</button>
    </div>
  </div>
</header>

<div class="banner" id="modeBanner">
  This is a live, read-only view for project stakeholders. Use the search and filters below to find tasks — to request an update or correction, contact the Owner's Rep team.
</div>

<main class="wrap">
  <section class="stat-grid" id="statGrid"></section>

  <section class="card">
    <h2 class="section-title">Open Tasks by Stakeholder Group</h2>
    <div class="group-grid" id="groupGrid"></div>
  </section>

  <section class="filters" id="filterBar">
    <div class="search-box">
      <span id="searchIcon"></span>
      <input id="searchInput" placeholder="Search tasks, notes, references…" />
    </div>
    <select id="personFilter"></select>
    <select id="groupFilter"></select>
    <select id="statusFilter"></select>
    <select id="priorityFilter"></select>
    <label class="checkbox-label">
      <input type="checkbox" id="overdueOnly" /> Overdue only
    </label>
    <button class="clear-link" id="clearFiltersBtn" style="display:none;">Clear filters</button>
  </section>

  <section class="table-card" id="tableCard"></section>

  <p class="footer-note" id="footerNote"></p>
</main>

<div id="modalRoot"></div>

<script>
/* ---------------------------------------------------------------
   Reference data
--------------------------------------------------------------- */
const STAKEHOLDER_GROUPS = [
  "Owner (UChicago)",
  "Owner's Rep (Capstone)",
  "Design-Builder",
  "Architect of Record (EMA)",
  "Other Consultants/Subs",
];
const GROUP_COLOR = {
  "Owner (UChicago)": "#800000",
  "Owner's Rep (Capstone)": "#007396",
  "Design-Builder": "#CC8A00",
  "Architect of Record (EMA)": "#275D38",
  "Other Consultants/Subs": "#737373",
};
const STATUSES = ["Open", "In Progress", "Blocked", "Closed"];
const STATUS_STYLE = {
  "Open": { color: "#3F5E22", bg: "#E8F0DC" },
  "In Progress": { color: "#7A5300", bg: "#FBF0D6" },
  "Blocked": { color: "#5C1F23", bg: "#F3DCDD" },
  "Closed": { color: "#404040", bg: "#E0E0E0" },
};
const PRIORITIES = ["Low", "Medium", "High", "Critical"];
const PRIORITY_COLOR = { Low: "#737373", Medium: "#007396", High: "#CC8A00", Critical: "#A4343A" };
const CSI_DIVISIONS = [
  "", "00 – Procurement and Contracting Requirements", "01 – General Requirements",
  "02 – Existing Conditions", "03 – Concrete", "04 – Masonry", "05 – Metals",
  "06 – Wood, Plastics, and Composites", "07 – Thermal and Moisture Protection", "08 – Openings",
  "09 – Finishes", "10 – Specialties", "11 – Equipment", "12 – Furnishings",
  "13 – Special Construction", "14 – Conveying Equipment", "21 – Fire Suppression",
  "22 – Plumbing", "23 – HVAC", "25 – Integrated Automation", "26 – Electrical",
  "27 – Communications", "28 – Electronic Safety and Security", "31 – Earthwork",
  "32 – Exterior Improvements", "33 – Utilities",
];

const TASKS_KEY = "sf-task-dashboard:tasks";
const NAMES_KEY = "sf-task-dashboard:names";
const EDITOR_PASSPHRASE = "fs-edits"; // UI convenience only — not real security. Change freely.

/* ---------------------------------------------------------------
   Icons (inline SVG, no external deps)
--------------------------------------------------------------- */
const ICONS = {
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  pencil: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A4343A" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  sort: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.5"><path d="M7 10l5-5 5 5M7 14l5 5 5-5"/></svg>',
};

/* ---------------------------------------------------------------
   State
--------------------------------------------------------------- */
let tasks = [];
let names = [];
let editorMode = false;
let loading = true;
let saving = false;

let state = {
  search: "",
  person: "All",
  group: "All",
  status: "All",
  priority: "All",
  overdueOnly: false,
  sortKey: "dueDate",
  sortDir: "asc",
};

/* ---------------------------------------------------------------
   Helpers
--------------------------------------------------------------- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayIso() { return new Date().toISOString().slice(0, 10); }
function formatDateUS(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return "—";
  return `${m}/${d}/${y}`;
}
function isOverdue(t) { return t.dueDate && t.status !== "Closed" && t.dueDate < todayIso(); }
function isDueSoon(t) {
  if (!t.dueDate || t.status === "Closed") return false;
  const due = new Date(t.dueDate + "T00:00:00");
  const now = new Date(todayIso() + "T00:00:00");
  const diff = (due - now) / 86400000;
  return diff >= 0 && diff <= 7;
}
function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function emptyTask() {
  return { id: null, title: "", description: "", stakeholderGroup: STAKEHOLDER_GROUPS[0], assignedTo: "",
    status: "Open", priority: "Medium", dueDate: "", dateAdded: todayIso(), csiDivision: "", source: "", notes: "" };
}

/* ---------------------------------------------------------------
   Storage
--------------------------------------------------------------- */
async function loadData() {
  try {
    try {
      const t = await window.storage.get(TASKS_KEY, true);
      if (t && t.value) tasks = JSON.parse(t.value);
    } catch (e) { /* not found yet */ }
    try {
      const n = await window.storage.get(NAMES_KEY, true);
      if (n && n.value) names = JSON.parse(n.value);
    } catch (e) { /* not found yet */ }
  } catch (e) {
    console.error("Load failed", e);
  } finally {
    loading = false;
    render();
  }
}
async function persistTasks() {
  saving = true; render();
  try { await window.storage.set(TASKS_KEY, JSON.stringify(tasks), true); }
  catch (e) { console.error("Save failed", e); }
  finally { saving = false; render(); }
}
async function persistNames() {
  try { await window.storage.set(NAMES_KEY, JSON.stringify(names), true); }
  catch (e) { console.error("Save failed", e); }
}
function rememberName(name) {
  const n = (name || "").trim();
  if (n && !names.includes(n)) {
    names = [...names, n].sort((a, b) => a.localeCompare(b));
    persistNames();
  }
}

/* ---------------------------------------------------------------
   Derived data
--------------------------------------------------------------- */
function getAllAssignedNames() {
  const fromTasks = tasks.map((t) => t.assignedTo).filter(Boolean);
  return Array.from(new Set([...names, ...fromTasks])).sort((a, b) => a.localeCompare(b));
}
function getFiltered() {
  let list = tasks.filter((t) => {
    if (state.person !== "All" && t.assignedTo !== state.person) return false;
    if (state.group !== "All" && t.stakeholderGroup !== state.group) return false;
    if (state.status !== "All" && t.status !== state.status) return false;
    if (state.priority !== "All" && t.priority !== state.priority) return false;
    if (state.overdueOnly && !isOverdue(t)) return false;
    if (state.search.trim()) {
      const q = state.search.toLowerCase();
      const hay = `${t.title} ${t.description} ${t.assignedTo} ${t.source} ${t.notes}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a, b) => {
    let av = a[state.sortKey] ?? "", bv = b[state.sortKey] ?? "";
    if (state.sortKey === "dueDate") { av = av || "9999-99-99"; bv = bv || "9999-99-99"; }
    if (state.sortKey === "priority") {
      const order = { Critical: 0, High: 1, Medium: 2, Low: 3 };
      av = order[a.priority]; bv = order[b.priority];
    }
    if (av < bv) return state.sortDir === "asc" ? -1 : 1;
    if (av > bv) return state.sortDir === "asc" ? 1 : -1;
    return 0;
  });
  return list;
}
function getStats() {
  const open = tasks.filter((t) => t.status !== "Closed").length;
  const overdue = tasks.filter(isOverdue).length;
  const dueSoon = tasks.filter(isDueSoon).length;
  const closed = tasks.filter((t) => t.status === "Closed").length;
  const byGroup = STAKEHOLDER_GROUPS.map((g) => ({
    group: g, count: tasks.filter((t) => t.stakeholderGroup === g && t.status !== "Closed").length,
  }));
  return { open, overdue, dueSoon, closed, byGroup };
}

/* ---------------------------------------------------------------
   Render
--------------------------------------------------------------- */
function render() {
  document.getElementById("plusIcon").innerHTML = ICONS.plus;
  document.getElementById("searchIcon").innerHTML = ICONS.search;
  document.getElementById("addTaskBtn").style.display = editorMode ? "inline-flex" : "none";
  document.getElementById("exportBtn").style.display = editorMode ? "inline-flex" : "none";
  document.getElementById("importBtn").style.display = editorMode ? "inline-flex" : "none";
  document.getElementById("editorToggleBtn").textContent = editorMode ? "Exit Editor Mode" : "Editor Mode";

  const banner = document.getElementById("modeBanner");
  if (editorMode) {
    banner.className = "banner editor";
    banner.textContent = "Editor mode is on — changes you make here save to the live shared view everyone sees. Turn this off before sharing your screen with stakeholders.";
  } else {
    banner.className = "banner";
    banner.textContent = "This is a live, read-only view for project stakeholders. Use the search and filters below to find tasks — to request an update or correction, contact the Owner's Rep team.";
  }

  if (loading) {
    document.getElementById("statGrid").innerHTML = "";
    document.getElementById("groupGrid").innerHTML = "";
    document.getElementById("tableCard").innerHTML = '<div class="empty-state"><p class="empty-title">Loading dashboard…</p></div>';
    document.getElementById("footerNote").textContent = "";
    return;
  }

  renderStats();
  renderGroupChips();
  renderFilterControls();
  renderTable();

  document.getElementById("footerNote").textContent = saving
    ? "Saving…"
    : `${tasks.length} task${tasks.length === 1 ? "" : "s"} tracked · last synced ${new Date().toLocaleTimeString()}`;
}

function renderStats() {
  const s = getStats();
  const cards = [
    { label: "Open Tasks", value: s.open, color: "#333333" },
    { label: "Overdue", value: s.overdue, color: "#A4343A" },
    { label: "Due in 7 Days", value: s.dueSoon, color: "#CC8A00" },
    { label: "Closed", value: s.closed, color: "#275D38" },
  ];
  document.getElementById("statGrid").innerHTML = cards.map((c) => `
    <div class="card">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value" style="color:${c.color}">${c.value}</div>
    </div>`).join("");
}

function renderGroupChips() {
  const s = getStats();
  document.getElementById("groupGrid").innerHTML = s.byGroup.map(({ group, count }) => {
    const active = state.group === group;
    const color = GROUP_COLOR[group];
    return `
      <button class="group-chip ${active ? "active-chip" : ""}" data-group="${escapeHtml(group)}"
        style="background:${active ? color + "15" : "#F5F5F5"}; border-color:${active ? color : "#D9D9D9"};">
        <div class="dot-row"><span class="dot" style="background:${color}"></span>
          <span class="g-label">${escapeHtml(group)}</span></div>
        <div class="g-count" style="color:#333333">${count}</div>
      </button>`;
  }).join("");
  document.querySelectorAll(".group-chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      const g = btn.getAttribute("data-group");
      state.group = state.group === g ? "All" : g;
      render();
    });
  });
}

function renderFilterControls() {
  const personSel = document.getElementById("personFilter");
  const allNames = getAllAssignedNames();
  personSel.innerHTML = `<option value="All">All People</option>` +
    allNames.map((n) => `<option value="${escapeHtml(n)}" ${state.person === n ? "selected" : ""}>${escapeHtml(n)}</option>`).join("");
  personSel.value = state.person;

  const groupSel = document.getElementById("groupFilter");
  groupSel.innerHTML = `<option value="All">All Groups</option>` +
    STAKEHOLDER_GROUPS.map((g) => `<option value="${escapeHtml(g)}" ${state.group === g ? "selected" : ""}>${escapeHtml(g)}</option>`).join("");
  groupSel.value = state.group;

  const statusSel = document.getElementById("statusFilter");
  statusSel.innerHTML = `<option value="All">All Statuses</option>` +
    STATUSES.map((s) => `<option value="${s}" ${state.status === s ? "selected" : ""}>${s}</option>`).join("");
  statusSel.value = state.status;

  const prioritySel = document.getElementById("priorityFilter");
  prioritySel.innerHTML = `<option value="All">All Priorities</option>` +
    PRIORITIES.map((p) => `<option value="${p}" ${state.priority === p ? "selected" : ""}>${p}</option>`).join("");
  prioritySel.value = state.priority;

  document.getElementById("searchInput").value = state.search;
  document.getElementById("overdueOnly").checked = state.overdueOnly;

  const anyActive = state.search || state.person !== "All" || state.group !== "All" || state.status !== "All" || state.priority !== "All" || state.overdueOnly;
  document.getElementById("clearFiltersBtn").style.display = anyActive ? "inline" : "none";
}

function renderTable() {
  const list = getFiltered();
  const container = document.getElementById("tableCard");

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <p class="empty-title">${tasks.length === 0 ? "No tasks yet" : "No tasks match these filters"}</p>
        <p class="empty-sub">${tasks.length === 0
          ? "Tasks added in editor mode will appear here for everyone viewing this dashboard."
          : "Try clearing a filter or adjusting your search."}</p>
      </div>`;
    return;
  }

  const sortIndicator = (key) => state.sortKey === key
    ? `${ICONS.sort} <span style="font-size:10px">${state.sortDir === "asc" ? "↑" : "↓"}</span>` : ICONS.sort;

  const rows = list.map((t) => {
    const overdue = isOverdue(t);
    const dueSoon = isDueSoon(t);
    const st = STATUS_STYLE[t.status];
    return `
      <tr>
        <td style="border-left:3px solid ${st.bg}">
          <div class="task-title">${escapeHtml(t.title)}</div>
          ${t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : ""}
          ${(t.source || t.csiDivision) ? `<div class="task-meta">
            ${t.source ? `<span>Ref: ${escapeHtml(t.source)}</span>` : ""}
            ${t.csiDivision ? `<span>CSI ${escapeHtml(t.csiDivision.split(" – ")[0])}</span>` : ""}
          </div>` : ""}
        </td>
        <td style="white-space:nowrap; font-size:12px;">${escapeHtml(t.stakeholderGroup)}</td>
        <td style="white-space:nowrap;">${escapeHtml(t.assignedTo) || "—"}</td>
        <td style="white-space:nowrap;"><span class="badge" style="background:${st.bg}; color:${st.color}">${t.status}</span></td>
        <td style="white-space:nowrap;"><span style="font-size:12px; font-weight:600; color:${PRIORITY_COLOR[t.priority]}">${t.priority}</span></td>
        <td style="white-space:nowrap; font-size:12px; ${overdue ? "color:#A4343A; font-weight:600;" : dueSoon ? "color:#7A5300;" : ""}">
          ${formatDateUS(t.dueDate)}${overdue ? " (overdue)" : ""}
        </td>
        ${editorMode ? `<td style="text-align:right; white-space:nowrap;">
          <button class="icon-btn" data-edit="${t.id}">${ICONS.pencil}</button>
          <button class="icon-btn" data-delete="${t.id}">${ICONS.trash}</button>
        </td>` : ""}
      </tr>`;
  }).join("");

  container.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th data-sort="title" class="${state.sortKey === "title" ? "active" : ""}">Task ${sortIndicator("title")}</th>
          <th data-sort="stakeholderGroup" class="${state.sortKey === "stakeholderGroup" ? "active" : ""}">Stakeholder Group ${sortIndicator("stakeholderGroup")}</th>
          <th data-sort="assignedTo" class="${state.sortKey === "assignedTo" ? "active" : ""}">Assigned To ${sortIndicator("assignedTo")}</th>
          <th data-sort="status" class="${state.sortKey === "status" ? "active" : ""}">Status ${sortIndicator("status")}</th>
          <th data-sort="priority" class="${state.sortKey === "priority" ? "active" : ""}">Priority ${sortIndicator("priority")}</th>
          <th data-sort="dueDate" class="${state.sortKey === "dueDate" ? "active" : ""}">Due Date ${sortIndicator("dueDate")}</th>
          ${editorMode ? `<th style="text-align:right;">Actions</th>` : ""}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  container.querySelectorAll("th[data-sort]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.getAttribute("data-sort");
      if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      else { state.sortKey = key; state.sortDir = "asc"; }
      render();
    });
  });
  container.querySelectorAll("[data-edit]").forEach((btn) => {
    btn.addEventListener("click", () => openModal(tasks.find((t) => t.id === btn.getAttribute("data-edit"))));
  });
  container.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-delete");
      const t = tasks.find((x) => x.id === id);
      if (confirm(`Delete "${t.title}"? This can't be undone.`)) {
        tasks = tasks.filter((x) => x.id !== id);
        persistTasks();
        render();
      }
    });
  });
}

/* ---------------------------------------------------------------
   Modal (editor mode only)
--------------------------------------------------------------- */
function openModal(task) {
  const form = task ? { ...task } : emptyTask();
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>${form.id ? "Edit Task" : "Add Task"}</h3>
          <button class="icon-btn" id="closeModal">${ICONS.x}</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>Task title <span class="req">*</span></label>
            <input id="f-title" value="${escapeHtml(form.title)}" placeholder="e.g. Submit revised curtain wall shop drawings" />
          </div>
          <div class="field">
            <label>Description</label>
            <textarea id="f-description" rows="2">${escapeHtml(form.description)}</textarea>
          </div>
          <div class="row-2">
            <div class="field">
              <label>Stakeholder group</label>
              <select id="f-group">${STAKEHOLDER_GROUPS.map((g) => `<option value="${escapeHtml(g)}" ${form.stakeholderGroup === g ? "selected" : ""}>${escapeHtml(g)}</option>`).join("")}</select>
            </div>
            <div class="field">
              <label>Assigned to</label>
              <input id="f-assigned" list="known-names" value="${escapeHtml(form.assignedTo)}" placeholder="Name of person" />
              <datalist id="known-names">${getAllAssignedNames().map((n) => `<option value="${escapeHtml(n)}"></option>`).join("")}</datalist>
            </div>
          </div>
          <div class="row-3">
            <div class="field">
              <label>Status</label>
              <select id="f-status">${STATUSES.map((s) => `<option value="${s}" ${form.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>
            </div>
            <div class="field">
              <label>Priority</label>
              <select id="f-priority">${PRIORITIES.map((p) => `<option value="${p}" ${form.priority === p ? "selected" : ""}>${p}</option>`).join("")}</select>
            </div>
            <div class="field">
              <label>Due date</label>
              <input type="date" id="f-due" value="${form.dueDate || ""}" />
            </div>
          </div>
          <div class="row-2">
            <div class="field">
              <label>Related CSI division (optional)</label>
              <select id="f-csi">${CSI_DIVISIONS.map((d) => `<option value="${escapeHtml(d)}" ${form.csiDivision === d ? "selected" : ""}>${d || "N/A"}</option>`).join("")}</select>
            </div>
            <div class="field">
              <label>Source / reference (optional)</label>
              <input id="f-source" value="${escapeHtml(form.source)}" placeholder="e.g. OAC Mtg 9/10/26, RFI-014" />
            </div>
          </div>
          <div class="field">
            <label>Notes (optional)</label>
            <textarea id="f-notes" rows="2">${escapeHtml(form.notes)}</textarea>
          </div>
          <p class="error-text" id="f-error" style="display:none;"></p>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="cancelModal">Cancel</button>
          <button class="btn-primary" id="saveModal">Save Task</button>
        </div>
      </div>
    </div>`;

  const close = () => { root.innerHTML = ""; };
  document.getElementById("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") close(); });
  document.getElementById("closeModal").addEventListener("click", close);
  document.getElementById("cancelModal").addEventListener("click", close);
  document.getElementById("saveModal").addEventListener("click", () => {
    const title = document.getElementById("f-title").value.trim();
    if (!title) {
      const err = document.getElementById("f-error");
      err.textContent = "Task title is required.";
      err.style.display = "block";
      return;
    }
    const updated = {
      ...form,
      title,
      description: document.getElementById("f-description").value,
      stakeholderGroup: document.getElementById("f-group").value,
      assignedTo: document.getElementById("f-assigned").value.trim(),
      status: document.getElementById("f-status").value,
      priority: document.getElementById("f-priority").value,
      dueDate: document.getElementById("f-due").value,
      csiDivision: document.getElementById("f-csi").value,
      source: document.getElementById("f-source").value,
      notes: document.getElementById("f-notes").value,
    };
    if (updated.id) {
      tasks = tasks.map((t) => (t.id === updated.id ? updated : t));
    } else {
      updated.id = uid();
      tasks = [...tasks, updated];
    }
    if (updated.assignedTo) rememberName(updated.assignedTo);
    persistTasks();
    close();
    render();
  });
}

/* ---------------------------------------------------------------
   Event wiring (static controls)
--------------------------------------------------------------- */
document.getElementById("addTaskBtn").addEventListener("click", () => openModal(null));
document.getElementById("exportBtn").addEventListener("click", () => {
  const payload = { exportedAt: new Date().toISOString(), tasks, names };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `task-dashboard-backup-${todayIso()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      const incomingTasks = Array.isArray(payload.tasks) ? payload.tasks : [];
      const incomingNames = Array.isArray(payload.names) ? payload.names : [];
      const mode = confirm(
        `This backup has ${incomingTasks.length} task(s).\n\nClick OK to REPLACE all current tasks with this backup.\nClick Cancel to MERGE it into your current tasks instead.`
      );
      if (mode) {
        tasks = incomingTasks;
        names = incomingNames;
      } else {
        const existingIds = new Set(tasks.map((t) => t.id));
        const merged = [...tasks];
        incomingTasks.forEach((t) => { if (!existingIds.has(t.id)) merged.push(t); });
        tasks = merged;
        names = Array.from(new Set([...names, ...incomingNames])).sort((a, b) => a.localeCompare(b));
      }
      persistTasks();
      persistNames();
      render();
      alert("Backup imported successfully.");
    } catch (err) {
      alert("Couldn't read that file — make sure it's a backup exported from this dashboard.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});
document.getElementById("editorToggleBtn").addEventListener("click", () => {
  if (!editorMode) {
    const pass = prompt("Enter editor passphrase:");
    if (pass !== EDITOR_PASSPHRASE) {
      if (pass !== null) alert("Incorrect passphrase.");
      return;
    }
  }
  editorMode = !editorMode;
  render();
});
document.getElementById("searchInput").addEventListener("input", (e) => { state.search = e.target.value; render(); });
document.getElementById("personFilter").addEventListener("change", (e) => { state.person = e.target.value; render(); });
document.getElementById("groupFilter").addEventListener("change", (e) => { state.group = e.target.value; render(); });
document.getElementById("statusFilter").addEventListener("change", (e) => { state.status = e.target.value; render(); });
document.getElementById("priorityFilter").addEventListener("change", (e) => { state.priority = e.target.value; render(); });
document.getElementById("overdueOnly").addEventListener("change", (e) => { state.overdueOnly = e.target.checked; render(); });
document.getElementById("clearFiltersBtn").addEventListener("click", () => {
  state = { ...state, search: "", person: "All", group: "All", status: "All", priority: "All", overdueOnly: false };
  render();
});

loadData();
</script>
